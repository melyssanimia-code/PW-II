<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planejador de Viagem</title>

    <link rel="stylesheet" href="variaveis.css">
</head>

<body>

    <div class="container">

        <h1>Planejador de Viagem</h1>

        <p>Calcule uma estimativa dos seus gastos durante a viagem.</p>

        <label for="destino">Destino:</label>
        <input type="text" id="destino" placeholder="Digite o destino">

        <label for="dias">Quantidade de dias:</label>
        <input type="number" id="dias" placeholder="Ex: 5">

        <label for="gasto">Gasto diário:</label>
        <input type="number" id="gasto" placeholder="Ex: 150">

        <button id="calcular">Calcular viagem</button>

    </div>

    <script src="variaveis.js"></script>

</body>
</html>
